# 网关形态：只做转发，不连数据库，单进程约 20MB 内存
app:
  name: Tenon 网关
  env: prod
server:
  port: 9100
  mode: release
log:
  level: info
  dir: logs
  filename: tenon-gateway.log
# 网关不连数据库、不加载业务模块，只做转发。
security:
  internal_token: "tenon-internal-token-change-me"
micro:
  mode: gateway
  timeout: 5s
  retries: 2
  registry:
    type: static
    endpoints:
      - "tenon-core=127.0.0.1:9000"
  routes:
    - prefix: /api/v1
      service: tenon-core
# 治理面控制地址。留空则只用上面的静态路由；
# 填了之后网关会订阅快照，动态路由与实例列表以控制面为准。
gov:
  enabled: true
  control_url: "http://127.0.0.1:9000"
  poll_interval: 5s
  snapshot_file: "data/gov-snapshot-gateway.json"
  # 注册到服务目录时用的服务名。不用 app.name：那是显示名，可以带中文。
  service_name: "tenon-gateway"
  # 是否把自己登记为实例并周期续约。自带网关多机部署时必须开，
  # 否则控制面只看得到内核服务，看不到网关的版本收敛情况。
  announce: true
  # 对外声明的 host，留空取主机名。跨机部署或需要健康检查时改成真实可达地址。
  advertise_addr: ""
