# 服务形态：只暴露指定业务模块，可横向扩展成独立服务
app:
  name: Keel 用户服务
  env: dev
server:
  port: 9001
  mode: release
log:
  level: info
  dir: logs
  filename: keel-user.log
jwt:
  secret: "请务必在生产环境替换为至少32位的随机字符串-keel-default-secret"
  issuer: keel
db:
  # 留空按 dsn 推断；多实例部署请改用 MySQL / PostgreSQL
  driver: ""
  dsn: data/keel.db
redis:
  # 服务形态通常多副本，建议填写地址启用 Redis；留空则为单实例本地缓存
  addr: ""
  # addr: "127.0.0.1:6379"
storage:
  type: auto
runtime:
  stateless: auto
  instances: 2
micro:
  mode: service
  modules: [user, role, dept, membership, monitor]
  registry:
    type: static
    endpoints:
      - "keel-core=127.0.0.1:9000"
