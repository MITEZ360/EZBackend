name: 缺陷报告
description: 报告一个可复现的问题
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么，期望是什么
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 配置、请求、操作步骤
      placeholder: |
        1. 配置 ...
        2. 请求 POST /api/v1/...
        3. 观察到 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      placeholder: v1.1.0 / 79f27f2
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: Go 1.21 / SQLite / Linux amd64
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      render: shell
