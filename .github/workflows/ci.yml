name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  backend:
    name: 后端（vet / 架构 / 测试 / 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.4'
          cache: true
      - name: 静态检查
        run: go vet ./...
      - name: 架构约束检查
        run: python3 scripts/check_architecture.py
      - name: 单元测试（含 race）
        run: go test -count=1 -race ./...
      - name: 构建单二进制
        run: CGO_ENABLED=0 go build -trimpath -o bin/tenon ./cmd/tenon

  frontend:
    name: 前端（typecheck / build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 安装依赖
        run: cd web && pnpm install --frozen-lockfile
      - name: 类型检查
        run: cd web && pnpm typecheck
      - name: 生产构建
        run: cd web && pnpm build

  docs:
    name: 接口文档幂等性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.4'
          cache: true
      - name: 安装 swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.4
      - name: 重新生成文档
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          make docs
      - name: 校验生成物无差异
        run: |
          if ! git diff --quiet -- internal/apidocs; then
            echo "接口文档与路由不同步，请先运行 make docs 并提交生成物："
            git diff --stat -- internal/apidocs
            exit 1
          fi

  # 跨方言与接口回归依赖容器/运行服务，放在手动触发，避免每次提交都拉镜像。
  integration:
    name: 集成（手动触发）
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.4'
          cache: true
      - name: 跨方言契约测试
        run: make test-dialect
      - name: 接口回归（起服务 + mock）
        run: make test-regression
