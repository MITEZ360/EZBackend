# ============================================================================
# 单机编排：MySQL 8 + Redis 7 + Tenon
# 启动：docker compose -f deploy/docker-compose.yml up -d
# 访问：http://localhost:9000  默认账号 admin / Admin@123456
# ============================================================================
name: tenon

services:
  mysql:
    image: mysql:8.0
    container_name: tenon-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: tenon-root-2026
      MYSQL_DATABASE: tenon
      MYSQL_USER: tenon
      MYSQL_PASSWORD: Tenon@123456
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utenon", "-pTenon@123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [tenon]

  redis:
    image: redis:7-alpine
    container_name: tenon-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [tenon]

  tenon:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tenon:latest
    container_name: tenon-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TENON_APP_ENV: prod
      TENON_SERVER_PORT: "9000"
      TENON_DB_DRIVER: mysql
      TENON_DB_DSN: "tenon:Tenon@123456@tcp(mysql:3306)/tenon?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai"
      TENON_REDIS_ADDR: "redis:6379"
      # 生产环境务必替换为 32 位以上随机串：openssl rand -base64 48
      TENON_JWT_SECRET: "please-change-this-to-a-random-48-chars-secret-key"
      TENON_SECURITY_INTERNAL_TOKEN: "please-change-this-internal-token"
      TENON_SECURITY_CAPTCHA_ENABLED: "false"
      TENON_LOG_LEVEL: info
      TENON_LOG_CONSOLE: "false"
    ports:
      - "9000:9000"
    volumes:
      - tenon-data:/app/data
      - tenon-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks: [tenon]

volumes:
  mysql-data:
  redis-data:
  tenon-data:
  tenon-logs:

networks:
  tenon:
    driver: bridge
