# ============================================================================
# Tenon 单体形态 K8s 部署清单
# 应用：kubectl apply -f deploy/k8s/tenon-core.yaml
# 前置：集群已具备 StorageClass（默认 default），镜像已推送至私有仓库
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: tenon
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenon-config
  namespace: tenon
data:
  TENON_APP_ENV: "prod"
  TENON_SERVER_PORT: "9000"
  TENON_DB_DRIVER: "mysql"
  TENON_DB_MAX_OPEN_CONNS: "100"
  TENON_DB_MAX_IDLE_CONNS: "20"
  TENON_REDIS_ADDR: "tenon-redis:6379"
  # 多副本必须使用对象存储：本地磁盘只有当前 Pod 可见
  TENON_STORAGE_TYPE: "auto"
  TENON_STORAGE_S3_ENDPOINT: "tenon-minio:9000"
  TENON_STORAGE_S3_BUCKET: "tenon"
  TENON_STORAGE_S3_USE_SSL: "false"
  TENON_RUNTIME_INSTANCES: "2"
  TENON_LOG_LEVEL: "info"
  TENON_LOG_CONSOLE: "false"
  TENON_MICRO_MODE: "mono"
  TENON_METRICS_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: tenon-secret
  namespace: tenon
type: Opaque
stringData:
  # 生产环境请用 openssl rand -base64 48 生成后替换
  TENON_JWT_SECRET: "please-change-this-to-a-random-48-chars-secret-key"
  TENON_SECURITY_INTERNAL_TOKEN: "please-change-this-internal-token"
  TENON_DB_DSN: "tenon:Tenon@123456@tcp(tenon-mysql:3306)/tenon?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai"
  # 对象存储密钥，替换为真实值
  TENON_STORAGE_S3_ACCESS_KEY: "tenon"
  TENON_STORAGE_S3_SECRET_KEY: "tenon-secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenon-core
  namespace: tenon
  labels:
    app.kubernetes.io/name: tenon
    app.kubernetes.io/component: core
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tenon
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenon
        app.kubernetes.io/component: core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: tenon
          image: registry.example.com/tenon:1.0.0
          imagePullPolicy: IfNotPresent
          args: ["-config", "/app/configs/config.yaml"]
          ports:
            - name: http
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: tenon-config
            - secretRef:
                name: tenon-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # 文件走对象存储后，容器内不再需要持久卷；/app/data 仅放临时文件
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: tenon-core
  namespace: tenon
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tenon
    app.kubernetes.io/component: core
  ports:
    - name: http
      port: 9000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tenon-core
  namespace: tenon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tenon-core
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tenon
  namespace: tenon
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: tenon.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tenon-core
                port:
                  number: 9000
