# ============================================================================
# Tenon 微服务形态：网关 + 领域服务
# 应用：kubectl apply -f deploy/k8s/tenon-gateway.yaml
# 说明：网关不连数据库、不加载业务模块，可独立扩容；领域服务按模块拆分，
#      通过 micro.modules 控制本进程暴露的接口，服务间用 DNS 发现。
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenon-gateway-config
  namespace: tenon
data:
  TENON_APP_ENV: "prod"
  TENON_SERVER_PORT: "9100"
  TENON_LOG_LEVEL: "info"
  TENON_LOG_CONSOLE: "false"
  TENON_MICRO_MODE: "gateway"
  TENON_MICRO_REGISTRY_TYPE: "dns"
  TENON_MICRO_REGISTRY_DNS_SUFFIX: "tenon.svc.cluster.local:9000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenon-gateway
  namespace: tenon
  labels:
    app.kubernetes.io/name: tenon
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tenon
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenon
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: gateway
          image: registry.example.com/tenon:1.0.0
          ports:
            - name: http
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: tenon-gateway-config
          env:
            # 网关模式下转发规则可通过挂载配置文件提供，保持与 configs/config.gateway.yaml 一致
            - name: TENON_GATEWAY_ROUTES
              value: "/api/v1=tenon-core"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tenon-gateway
  namespace: tenon
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: tenon
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
# ---------------------------------------------------------------------------
# 领域服务示例：用户服务（只暴露用户/角色/部门相关接口）
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenon-user
  namespace: tenon
  labels:
    app.kubernetes.io/name: tenon
    app.kubernetes.io/component: user
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tenon
      app.kubernetes.io/component: user
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenon
        app.kubernetes.io/component: user
    spec:
      containers:
        - name: user
          image: registry.example.com/tenon:1.0.0
          envFrom:
            - configMapRef:
                name: tenon-config
            - secretRef:
                name: tenon-secret
          env:
            - name: TENON_MICRO_MODE
              value: "service"
            - name: TENON_MICRO_MODULES
              value: "user,role,dept"
          ports:
            - name: http
              containerPort: 9000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tenon-user
  namespace: tenon
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tenon
    app.kubernetes.io/component: user
  ports:
    - name: http
      port: 9000
      targetPort: http
