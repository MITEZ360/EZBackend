# ============================================================================
# Keel 单体形态 K8s 部署清单
# 应用：kubectl apply -f deploy/k8s/keel-core.yaml
# 前置：集群已具备 StorageClass（默认 default），镜像已推送至私有仓库
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: keel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keel-config
  namespace: keel
data:
  KEEL_APP_ENV: "prod"
  KEEL_SERVER_PORT: "9000"
  KEEL_DB_DRIVER: "mysql"
  KEEL_DB_MAX_OPEN_CONNS: "100"
  KEEL_DB_MAX_IDLE_CONNS: "20"
  KEEL_REDIS_ENABLED: "true"
  KEEL_REDIS_ADDR: "keel-redis:6379"
  KEEL_LOG_LEVEL: "info"
  KEEL_LOG_CONSOLE: "false"
  KEEL_MICRO_MODE: "mono"
  KEEL_METRICS_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: keel-secret
  namespace: keel
type: Opaque
stringData:
  # 生产环境请用 openssl rand -base64 48 生成后替换
  KEEL_JWT_SECRET: "please-change-this-to-a-random-48-chars-secret-key"
  KEEL_SECURITY_INTERNAL_TOKEN: "please-change-this-internal-token"
  KEEL_DB_DSN: "keel:Keel@123456@tcp(keel-mysql:3306)/keel?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel-core
  namespace: keel
  labels:
    app.kubernetes.io/name: keel
    app.kubernetes.io/component: core
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: keel
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keel
        app.kubernetes.io/component: core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: keel
          image: registry.example.com/keel:1.0.0
          imagePullPolicy: IfNotPresent
          args: ["-config", "/app/configs/config.yaml"]
          ports:
            - name: http
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: keel-config
            - secretRef:
                name: keel-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: keel-data
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keel-data
  namespace: keel
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: keel-core
  namespace: keel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keel
    app.kubernetes.io/component: core
  ports:
    - name: http
      port: 9000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: keel-core
  namespace: keel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: keel-core
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keel
  namespace: keel
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: keel.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keel-core
                port:
                  number: 9000
